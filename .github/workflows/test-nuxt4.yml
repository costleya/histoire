name: Nuxt 4 tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to test
        required: true
        default: all
        type: choice
        options:
          - all
          - macos-latest

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.runner == 'macos-latest' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/repro-nuxt4-macos')) && '["macos-latest"]' || '["ubuntu-latest","macos-latest"]') }}

    runs-on: ${{ matrix.os }}
    name: Build and test (${{ matrix.os }})

    env:
      dir: ./examples/nuxt4

    steps:
      - uses: actions/checkout@master

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "::set-output name=pnpm_cache_dir::$(pnpm store path)"

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
            ~/.cache/Cypress
            ~/Library/Caches/Cypress
          key: pnpm-v1-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-v1-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Build book
        working-directory: ${{env.dir}}
        run: pnpm run story:build

      - name: Run tests
        working-directory: ${{env.dir}}
        run: pnpm run ci

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.os }}
          path: ${{env.dir}}/cypress/screenshots
