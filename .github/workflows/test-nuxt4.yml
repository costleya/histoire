name: Nuxt 4 macOS story:dev repro

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4.0.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Run story:dev
        shell: bash
        run: |
          set -e
          ulimit -n

          pnpm --dir examples/nuxt4 run story:dev &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT

          for second in {1..60}; do
            if ! kill -0 "$dev_pid" 2>/dev/null; then
              wait "$dev_pid" || dev_status=$?
              exit "${dev_status:-1}"
            fi
            if curl --fail --silent --connect-timeout 1 --max-time 1 http://localhost:6006/ >/dev/null; then
              echo "story:dev became ready after ${second}s"
              exit 0
            fi
            sleep 1
          done

          echo 'story:dev did not become ready within 60 seconds'
          exit 1
