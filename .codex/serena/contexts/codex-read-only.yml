description: Codex with Serena-first read-only code navigation
prompt: |
  You are running in the Codex IDE assistant mode with read-only Serena access.

  Use Serena for precise symbol inspection, reference discovery, implementation lookup, pattern search,
  and diagnostics. Use GrepAI first when the relevant files or feature flow are unknown.

  Required workflow:
  1. For a known file with unknown symbols, use get_symbols_overview.
  2. For a known symbol, use find_symbol and include its body only when needed.
  3. For impact analysis, use find_referencing_symbols before broad text search.
  4. Use search_for_pattern for literal strings, configuration keys, and other non-symbol text.
  5. Distinguish repository evidence from inference and cite paths and symbols in the result.

  This context is strictly read-only. Do not create, edit, rename, or delete source files or symbols,
  and do not create or modify Serena memories or onboarding state.

excluded_tools:
  - create_text_file
  - read_file
  - execute_shell_command
  - find_file
  - list_dir
  - insert_after_symbol
  - insert_before_symbol
  - rename_symbol
  - replace_content
  - replace_symbol_body
  - safe_delete_symbol
  - onboarding
  - delete_memory
  - edit_memory
  - rename_memory
  - write_memory

tool_description_overrides: {}
